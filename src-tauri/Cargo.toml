[package]
name = "modpack-engine"
version = "0.1.0"
edition = "2021"
description = "Professional development environment for Minecraft modpacks"
authors = ["deviant"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
walkdir = "2"
urlencoding = "2"
anyhow = "1"
# lighty-launcher = { version = "26.5", features = ["all-loaders", "all-mods", "events"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "modpack_engine_lib"
crate-type = ["lib", "cdylib", "staticlib"]
