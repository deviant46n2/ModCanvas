[package]
name = "modcanvas"
version = "0.1.0"
edition = "2021"
description = "ModCanvas - Professional development environment for Minecraft modpacks"
authors = ["deviant"]
license = "GPL-3.0"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Use the xdg-desktop-portal backend instead of rfd's default gtk3 backend:
# a GTK dialog window fails to map on some Wayland compositors (e.g. COSMIC),
# while the portal route is compositor-agnostic and healthy.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite = "0.21"
futures-util = "0.3"
tracing = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml_edit = { version = "0.22", features = ["serde"] }
zip = "2"
tempfile = "3"
walkdir = "2"
urlencoding = "2"
anyhow = "1"
regex = "1"
base64 = "0.22"
json5 = "0.4"
dirs-next = "2"
dotenvy = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[lib]
name = "modcanvas_lib"
crate-type = ["lib", "cdylib", "staticlib"]
