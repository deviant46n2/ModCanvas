id: com.modcanvas.app
runtime: org.gnome.Platform
runtime-version: '50'  # 47 was EOL + crashing webkit on this box (Trayscale control: Tauri+webkit works on 50)
# sdk = runtime: install-only module, nothing is compiled here; the runtime
# doubles as the build sandbox (avoids the ~1GB org.gnome.Sdk download a
# from-source build would need). The Flathub variant will use the real sdk +
# rust/node sdk-extensions.
sdk: org.gnome.Platform
command: modcanvas

# Local-testing wrap manifest (2026-08-14).
# Wraps the CURRENT release binary (src-tauri/target/release/modcanvas) —
# the fast iteration path. A Flathub submission later needs the from-source
# variant (sdk-extensions rust-stable + node, cargo/node sources generated by
# flatpak-builder-tools, build via `tauri build -- -b deb`) — that is a
# separate artifact, deliberately NOT built yet (same logic as the AppImage
# DMABUF re-bake: the local artifact is test-shaped, not publish-shaped).

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # Modrinth API + compat metadata + the loopback WS bridge to the companion.
  # (loopback works because flatpak shares the host network namespace)
  - --share=network
  # The file door: ModCanvas reads/writes INSIDE Prism instance folders.
  # :create = grant also creates the path if missing (fresh-machine safe).
  - --filesystem=~/.var/app/org.prismlauncher.PrismLauncher:create
  - --filesystem=~/.local/share/PrismLauncher:create
  # Keyring (Secret Service) — the app falls back to DB when absent.
  - --talk-name=org.freedesktop.secrets
  # Process door: the app spawns Prism via `flatpak-spawn --host flatpak run …`;
  # --host requires permission to talk to org.freedesktop.Flatpak (verified
  # s55: without it, spawns fail "Portal call failed: ServiceUnknown").
  - --talk-name=org.freedesktop.Flatpak
  # NO WEBKIT_DISABLE_DMABUF_RENDERER here — that env is the APPIMAGE's fix
  # (host webkit + GBM white-screen, baked into AppRun there). The flatpak's
  # runtime webkit (GNOME 50) does not have that bug; the env actively broke
  # rendering in the sandbox (verified s55: white webview with it, removed).
  # If a white screen ever reappears in the sandbox, re-test THIS env (or
  # WEBKIT_DISABLE_COMPOSITING_MODE=1 per the Tauri Wayland webview doc)
  # before touching the AppImage bake.

modules:
  - name: modcanvas
    buildsystem: simple
    build-commands:
      - install -Dm755 modcanvas /app/bin/modcanvas
      - install -Dm755 libbz2.so.1.0 /app/lib/libbz2.so.1.0
      - install -Dm644 workbench-companion-1.0.0.jar /app/share/modcanvas/companion/workbench-companion-1.0.0.jar
      - install -Dm644 com.modcanvas.app.desktop /app/share/applications/com.modcanvas.app.desktop
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/com.modcanvas.app.png
      - install -Dm644 64x64.png /app/share/icons/hicolor/64x64/apps/com.modcanvas.app.png
      - install -Dm644 32x32.png /app/share/icons/hicolor/32x32/apps/com.modcanvas.app.png
    sources:
      # The release binary — MUST be rebuilt + verified current (stale-binary
      # discipline: compare mtime against the newest src-tauri/frontend edit)
      # before every wrap, or the flatpak silently serves old behavior.
      - type: file
        path: ../src-tauri/target/release/modcanvas
      # The companion mod jar — OUR artifact, bundled (NOT a game asset; the
      # no-bundling rule doesn't apply). resolve_companion_source_jar checks
      # this bundled path first (s55: the app previously only knew dev-machine
      # paths, so a sandboxed build could never deploy the companion).
      # REBUILD + re-wrap after `./gradlew build` in the companion module.
      - type: file
        path: ../workbench-companion-neoforge-1.21/build/libs/workbench-companion-1.0.0.jar
      # LOCAL-TEST DIVERGENCE (ledgered): the GNOME runtime lacks libbz2,
      # which the binary links directly (mrpack import path). Host .so shipped
      # into /app/lib — ABI-safe (bz2 soname frozen since 1996) but still
      # host-built; the Flathub variant must build bzip2 from source. Verify:
      # flatpak run works, quests import.
      - type: file
        path: /usr/lib/libbz2.so.1.0
      - type: file
        path: com.modcanvas.app.desktop
      - type: file
        path: ../src-tauri/icons/128x128.png
      - type: file
        path: ../src-tauri/icons/64x64.png
      - type: file
        path: ../src-tauri/icons/32x32.png
