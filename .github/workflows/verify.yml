# verify.yml — the s65 CI verification matrix (roadmap §13 P0-DISTRIB, SCOPED).
#
# Scope (the ruling, deliberately narrow):
#   * Two runners: ubuntu-latest + windows-latest. The point is the second
#     witness + the platform claims: the codebase says "Windows support"
#     (AGENTS.md EBUSY two-tier pipeline, roadmap risk #5) with zero
#     observations — this matrix is where that claim gets tested.
#   * Checks: cargo test --locked, pnpm test, pnpm lint, pnpm integrity.
#   * TESTING ONLY. No release artifacts, no CD. A Windows release is gated
#     on this matrix existing first (distribution follows verification).
#
# Platform facts (verified s65):
#   * cargo test compiles the whole crate graph including tauri → Linux needs
#     webkit2gtk-4.1 + friends (Tauri v2 official prerequisite list).
#     windows-latest has WebView2 + MSVC preinstalled.
#   * The integrity gate's build-smoke section spawns `sh` (Linux-only) —
#     the Windows job skips it via --skip=build-smoke (integrity-select.mjs)
#     and runs the frontend build as its own step instead.
#   * stale-binary is CI-safe by design: no binary on a fresh clone → INFO,
#     not violation (integrity-check.mjs).
#   * pnpm install runs in frontend/ (the real lockfile lives there; the root
#     lockfile is a stub). The integrity scripts need no npm deps.

name: verify

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system deps (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update &&
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Rust tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Frontend tests
        run: pnpm test
        working-directory: frontend

      - name: Frontend lint
        run: pnpm lint
        working-directory: frontend

      - name: Frontend build (Windows build-smoke stand-in)
        if: matrix.os == 'windows-latest'
        run: pnpm build
        working-directory: frontend

      - name: "Integrity gate (Linux: all sections)"
        if: matrix.os == 'ubuntu-latest'
        run: pnpm integrity

      - name: "Integrity gate (Windows: all but build-smoke, which spawns sh)"
        if: matrix.os == 'windows-latest'
        run: node scripts/integrity-check.mjs --skip=build-smoke